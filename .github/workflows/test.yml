name: test

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  build:
  
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 12
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10"]
        
    steps:
    - name: Checkout Repository 
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install pip dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test with pytest
      run: |
        coverage run -m pytest
        coverage xml -i
      env:
        PLATFORM: ${{ matrix.os }}

    # The concurrency specs fail on scheduling, so a single green run says very
    # little. Repeating surfaces the flakiness a one-shot run hides. No extra
    # dependency: a shell loop is enough, and it stops at the first bad run.
    - name: Stress the concurrency specs
      # bash explicitly: the matrix includes windows-latest, where the default
      # shell is PowerShell and a POSIX for-loop is a syntax error, so the step
      # would fail before running a single test.
      shell: bash
      run: |
        for attempt in 1 2 3 4 5; do
          echo "--- stress attempt $attempt ---"
          python -m pytest -m stress -q || exit 1
        done
      env:
        PLATFORM: ${{ matrix.os }}
      
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4.0.1
      with:
        files: src/client/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

